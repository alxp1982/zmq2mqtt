<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMQ2MQTT Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .status {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            text-align: center;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .chart-container {
            height: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">ZMQ2MQTT Dashboard</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">Connection Status</h5>
                    </div>
                    <div class="card-body">
                        <div class="status" id="zmq-status">ZMQ: Disconnected</div>
                        <div class="status" id="mqtt-status">MQTT: Disconnected</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">Message Counters</h5>
                    </div>
                    <div class="card-body">
                        <p>Received: <span id="messages-received">0</span></p>
                        <p>Forwarded: <span id="messages-forwarded">0</span></p>
                        <p>Rate: <span id="message-rate">0</span> msg/s</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">Message Rate</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="rate-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://' + window.location.host + '/ws');
        const rateChart = new Chart(document.getElementById('rate-chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Message Rate',
                    data: [],
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        ws.onmessage = function(event) {
            const stats = JSON.parse(event.data);
            
            // Update connection status
            document.getElementById('zmq-status').textContent = 'ZMQ: ' + (stats.zmq_connected ? 'Connected' : 'Disconnected');
            document.getElementById('zmq-status').className = 'status ' + (stats.zmq_connected ? 'connected' : 'disconnected');
            
            document.getElementById('mqtt-status').textContent = 'MQTT: ' + (stats.mqtt_connected ? 'Connected' : 'Disconnected');
            document.getElementById('mqtt-status').className = 'status ' + (stats.mqtt_connected ? 'connected' : 'disconnected');
            
            // Update counters
            document.getElementById('messages-received').textContent = stats.messages_received;
            document.getElementById('messages-forwarded').textContent = stats.messages_forwarded;
            document.getElementById('message-rate').textContent = stats.message_rate.toFixed(2);
            
            // Update chart
            const now = new Date().toLocaleTimeString();
            rateChart.data.labels.push(now);
            rateChart.data.datasets[0].data.push(stats.message_rate);
            
            if (rateChart.data.labels.length > 30) {
                rateChart.data.labels.shift();
                rateChart.data.datasets[0].data.shift();
            }
            
            rateChart.update();
        };
    </script>
</body>
</html>
